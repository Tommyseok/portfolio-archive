<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Noto+Serif+KR:wght@400;500&family=Gowun+Batang&family=Hahmlet:wght@300;400;500&family=Song+Myung&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  body { margin: 0; background: #f4f4f5; font-family: Pretendard, sans-serif; padding: 24px; }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .tile {
    position: relative; height: 210px; border-radius: 4px; overflow: hidden;
    background: linear-gradient(135deg, #23262e 0%, #3a3f4b 55%, #6b5a4e 100%);
    display: flex; align-items: flex-end; padding: 20px 22px; box-sizing: border-box;
  }
  .tile::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, transparent 40%, rgba(10,10,12,.55));
  }
  .label { position: relative; color: #fff; width: 100%; }
  .tag {
    position: absolute; top: -140px; left: 0; font-family: Pretendard, sans-serif;
    font-size: 11px; font-weight: 700; letter-spacing: .1em; color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.35); padding: 4px 10px; border-radius: 999px;
  }
  .name { font-size: 40px; line-height: 1.05; letter-spacing: .01em; display: flex; align-items: baseline; gap: 10px; }
  .name .en { margin-left: 14px; }
  .plus { font-family: Pretendard, sans-serif; font-weight: 300; font-size: .6em; }
  .svc { margin-top: 8px; font-family: Pretendard, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.72); }

  .f-noto  .name { font-family: "Noto Serif KR", serif; }
  .f-noto  .en   { font-family: "Instrument Serif", serif; }
  .f-gowun .name { font-family: "Gowun Batang", serif; }
  .f-gowun .en   { font-family: "Instrument Serif", serif; }
  .f-hahml .name { font-family: Hahmlet, serif; font-weight: 400; }
  .f-song  .name { font-family: "Song Myung", serif; }
  .f-song  .en   { font-family: "Instrument Serif", serif; }
  .f-nanum .name { font-family: "Nanum Myeongjo", serif; }
  .f-nanum .en   { font-family: "Instrument Serif", serif; }
  .f-pret  .name { font-family: Pretendard, sans-serif; font-weight: 650; letter-spacing: -0.03em; }
</style>
</head>
<body>
<div class="row">
  <div class="tile f-noto"><div class="label"><span class="tag">A · Noto Serif KR (현재)</span><div class="name">무신사<span class="plus">+</span><span class="en">29CM</span></div><div class="svc">Static design, Banner</div></div></div>
  <div class="tile f-gowun"><div class="label"><span class="tag">B · Gowun Batang</span><div class="name">무신사<span class="plus">+</span><span class="en">29CM</span></div><div class="svc">Static design, Banner</div></div></div>
  <div class="tile f-hahml"><div class="label"><span class="tag">C · Hahmlet</span><div class="name">무신사<span class="plus">+</span><span class="en">29CM</span></div><div class="svc">Static design, Banner</div></div></div>
  <div class="tile f-song"><div class="label"><span class="tag">D · Song Myung</span><div class="name">무신사<span class="plus">+</span><span class="en">29CM</span></div><div class="svc">Static design, Banner</div></div></div>
  <div class="tile f-nanum"><div class="label"><span class="tag">E · Nanum Myeongjo</span><div class="name">무신사<span class="plus">+</span><span class="en">29CM</span></div><div class="svc">Static design, Banner</div></div></div>
  <div class="tile f-pret"><div class="label"><span class="tag">F · Pretendard 세미볼드 (산세리프)</span><div class="name">무신사<span class="plus">+</span><span class="en">29CM</span></div><div class="svc">Static design, Banner</div></div></div>
</div>
</body>
</html>
